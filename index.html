<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS OS | CBT Suite</title>
    <style>
        body { background: #030712; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        input, select { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 16px; background: #000; border: 1px solid #334151; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #020617; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .error { color: #ef4444; font-size: 13px; font-weight: bold; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2 style="text-align: center; color: #00f2fe; margin-top:0;">NEXUS OS</h2>
        <p style="font-size: 12px; color: #94a3b8; text-align: center;">Enter PIN and at least one API Key.</p>
        
        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Master Passcode</label>
        <input type="password" id="input-pass" value="admin2026">
        
        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Gemini API Key (Optional)</label>
        <input type="password" id="input-gemini" placeholder="AIzaSy...">
        
        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Groq API Key (Optional)</label>
        <input type="password" id="input-groq" placeholder="gsk_...">
        
        <button onclick="handleLoginBtn()">Initialize Session</button>
        <div id="err-msg" class="error"></div>
    </div>

    <!-- MAIN APP SCREEN (Initially Hidden) -->
    <div id="main-screen" class="card" style="display: none; max-width: 600px;">
        <h2 style="color: #10b981; margin-top:0;">System Online</h2>
        <p>Authentication successful. Engine ready for configuration.</p>
        <button onclick="localStorage.clear(); location.reload();" style="background: #ef4444; color: #fff;">Terminate Session</button>
    </div>

    <script>
        // Force test execution on click
        function handleLoginBtn() {
            try {
                const passField = document.getElementById('input-pass').value.trim();
                const geminiField = document.getElementById('input-gemini').value.trim();
                const groqField = document.getElementById('input-groq').value.trim();
                const errBox = document.getElementById('err-msg');

                if (passField !== "admin2026") {
                    errBox.style.display = 'block';
                    errBox.innerText = "Invalid Passcode. Default is admin2026";
                    return;
                }

                if (!geminiField && !groqField) {
                    errBox.style.display = 'block';
                    errBox.innerText = "Please provide at least one API Key.";
                    return;
                }

                // Save to local storage safely
                localStorage.setItem("APP_PASS", passField);
                if (geminiField) localStorage.setItem("GEMINI_KEY", geminiField);
                if (groqField) localStorage.setItem("GROQ_KEY", groqField);

                // Switch UI views instantly
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';

            } catch (err) {
                alert("Critical Execution Error: " + err.message);
            }
        }

        // Auto-login check on page load
        window.onload = function() {
            try {
                if (localStorage.getItem("APP_PASS") === "admin2026") {
                    const g = localStorage.getItem("GEMINI_KEY");
                    const gr = localStorage.getItem("GROQ_KEY");
                    if (g || gr) {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('main-screen').style.display = 'block';
                    }
                }
            } catch(e) {}
        };
    </script>
</body>
</html>
