<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Portal</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        h1 { text-align: center; color: #3b82f6; font-size: 24px; margin-bottom: 25px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        label { display: block; margin-top: 15px; font-weight: 500; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px; border-radius: 6px; font-size: 16px; margin-top: 25px; transition: background 0.2s; }
        button:active { background: #2563eb; }
        #terminal { background: #000; color: #10b981; padding: 15px; border-radius: 8px; font-family: monospace; height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; display: none; border: 1px solid #334155; }
        .q-block { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .q-block h4 { margin-top: 0; font-size: 16px; line-height: 1.5; color: #f1f5f9; }
        .option-label { display: block; padding: 14px; background: #0f172a; margin: 10px 0; border-radius: 6px; cursor: pointer; border: 1px solid #334155; }
        .correct { background: #064e3b !important; border-color: #10b981 !important; color: #34d399; font-weight: bold; }
        .wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fca5a5; font-weight: bold; }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        .hidden { display: none; }
        #score-board { font-size: 22px; font-weight: bold; text-align: center; color: #10b981; margin-bottom: 20px; padding: 15px; background: #064e3b; border-radius: 8px; border: 1px solid #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OPSC / UPSC Portal</h1>

        <!-- API Key Setup (Saved to Phone) -->
        <div id="key-screen" class="card">
            <h2 style="margin-top: 0; font-size: 18px;">Security Setup</h2>
            <p style="color: #94a3b8; font-size: 14px;">Enter your Gemini API Key. It is saved securely in this browser and never uploaded.</p>
            <input type="password" id="api-key" placeholder="AIzaSy...">
            <button onclick="saveKey()">Save & Continue</button>
        </div>
        
        <!-- Setup Exam -->
        <div id="setup-screen" class="card hidden">
            <h2 style="margin-top: 0; font-size: 18px;">Configure Exam</h2>
            <label>Topic / Concept</label>
            <input type="text" id="topic" value="ତତ୍ସମ ଶବ୍ଦ (Tatsama Sabda)">
            <label>Question Count (Max 100)</label>
            <input type="number" id="count" value="50" min="1" max="100">
            <label>Language</label>
            <input type="text" id="lang" value="Odia">
            <button onclick="startGeneration()">Launch Exam Engine</button>
            <p style="text-align:center; margin-top:20px; font-size:12px; color:#ef4444;" onclick="resetKey()">Reset API Key</p>
        </div>

        <!-- Terminal Screen -->
        <div id="terminal-screen" class="hidden">
            <h3 style="text-align: center; font-size: 16px; color: #3b82f6;">Streaming directly from Gemini...</h3>
            <div id="terminal"></div>
        </div>

        <!-- Exam Screen -->
        <div id="exam-screen" class="hidden">
            <div id="score-board" class="hidden"></div>
            <div id="questions-container"></div>
            <button id="submit-btn" onclick="submitExam()">Submit Exam</button>
        </div>
    </div>

    <script>
        let quizData = [];

        // Check if key exists in mobile local storage
        window.onload = () => {
            if (localStorage.getItem("GEMINI_KEY")) {
                document.getElementById('key-screen').classList.add('hidden');
                document.getElementById('setup-screen').classList.remove('hidden');
            }
        };

        function saveKey() {
            const key = document.getElementById('api-key').value.trim();
            if (key) {
                localStorage.setItem("GEMINI_KEY", key);
                document.getElementById('key-screen').classList.add('hidden');
                document.getElementById('setup-screen').classList.remove('hidden');
            }
        }

        function resetKey() {
            localStorage.removeItem("GEMINI_KEY");
            location.reload();
        }

        async function startGeneration() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('terminal-screen').classList.remove('hidden');
            const terminal = document.getElementById('terminal');
            terminal.style.display = 'block';
            
            const topic = document.getElementById('topic').value;
            const count = document.getElementById('count').value;
            const lang = document.getElementById('lang').value;
            const apiKey = localStorage.getItem("GEMINI_KEY");
            
            const prompt = `You are an expert examiner. Generate EXACTLY ${count} TRICKY practice questions about "${topic}". Target language: ${lang}. 
RULES: 1. NO EXPLANATIONS. 2. Distractors must be highly plausible. 3. Output ONLY a valid JSON array.
FORMAT:
[
  {
    "question": "Question text...",
    "options": ["Opt1", "Opt2", "Opt3", "Opt4"],
    "correct_option_index": 2
  }
]`;

            try {
                // Connect directly to Google API from mobile browser
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-pro:streamGenerateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.3, maxOutputTokens: 65536, responseMimeType: 'application/json' }
                    })
                });

                if (!response.ok) throw new Error("API Error: Check your API Key or Network.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullNetworkResponse = "";
                let visualText = "";

                // Stream processing loop
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunkStr = decoder.decode(value, { stream: true });
                    fullNetworkResponse += chunkStr;
                    
                    // Regex for cool terminal visual effect while generating
                    const textMatches = [...chunkStr.matchAll(/"text"\s*:\s*"((?:[^"\\]|\\.)*)"/g)];
                    for (const match of textMatches) {
                        visualText += match[1].replace(/\\n/g, '\\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\\\');
                        terminal.textContent = visualText;
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                }

                // Parse the complete raw array returned by Gemini
                const geminiArray = JSON.parse(fullNetworkResponse);
                let completeText = "";
                geminiArray.forEach(block => {
                    if (block.candidates && block.candidates[0].content) {
                        completeText += block.candidates[0].content.parts[0].text;
                    }
                });

                // Clean and extract the actual JSON
                let jsonString = completeText;
                const jsonMatch = completeText.match(/\\[[\\s\\S]*\\]/);
                if (jsonMatch) jsonString = jsonMatch[0];

                quizData = JSON.parse(jsonString);
                renderExam();

            } catch (err) {
                terminal.textContent += `\\n\\n[CRASH ERROR] ${err.message}`;
            }
        }

        function renderExam() {
            document.getElementById('terminal-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            quizData.forEach((q, qIndex) => {
                let html = `<div class="q-block"><h4>Q${qIndex + 1}. ${q.question}</h4>`;
                q.options.forEach((opt, oIndex) => {
                    html += `<label class="option-label" id="label-${qIndex}-${oIndex}">
                                <input type="radio" name="q-${qIndex}" value="${oIndex}"> ${opt}
                             </label>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function submitExam() {
            let score = 0;
            quizData.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q-${qIndex}"]:checked`);
                const correctIdx = q.correct_option_index;
                
                const correctLabel = document.getElementById(`label-${qIndex}-${correctIdx}`);
                if (correctLabel) correctLabel.classList.add('correct');
                
                if (selected) {
                    const selectedIdx = parseInt(selected.value);
                    if (selectedIdx === correctIdx) {
                        score++;
                    } else {
                        const wrongLabel = document.getElementById(`label-${qIndex}-${selectedIdx}`);
                        if (wrongLabel) wrongLabel.classList.add('wrong');
                    }
                }
            });
            document.getElementById('submit-btn').style.display = 'none';
            const scoreboard = document.getElementById('score-board');
            scoreboard.innerText = `Final Score: ${score} / ${quizData.length}`;
            scoreboard.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
